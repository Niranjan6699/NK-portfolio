<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" fill="none">
  <rect width="800" height="500" fill="#000000"/>

  <!-- Architecture Blueprint Header -->
  <text x="50" y="60" fill="rgba(255,255,255,0.3)" font-family="'JetBrains Mono', monospace" font-size="12" letter-spacing="0.1em">FEDERATED HEALTH SYSTEMS // PROTOTYPE</text>
  <text x="50" y="95" fill="#FFFFFF" font-family="'Instrument Serif', serif" font-size="34">MedGrid Nexus: Federated Clinical Knowledge Platform</text>
  <text x="50" y="125" fill="#eca8d6" font-family="'JetBrains Mono', monospace" font-size="12">ANDROID JETPACK COMPOSE · SPRING BOOT · APACHE JENA TDB2 · SPARQL · RMI</text>

  <!-- Federated Grid Nodes -->
  <g transform="translate(50, 180)">
    <!-- Hospital Node A -->
    <rect x="0" y="0" width="200" height="190" rx="8" fill="#000000" stroke="rgba(255,255,255,0.12)" stroke-width="1.5"/>
    <text x="20" y="35" fill="#FFFFFF" font-family="'Instrument Serif', serif" font-size="18">CLINIC NODE A</text>
    <text x="20" y="65" fill="rgba(255,255,255,0.5)" font-family="'JetBrains Mono', monospace" font-size="10">• Local Apache Jena TDB2</text>
    <text x="20" y="85" fill="rgba(255,255,255,0.5)" font-family="'JetBrains Mono', monospace" font-size="10">• Ontological Triplestore</text>
    <text x="20" y="105" fill="rgba(255,255,255,0.5)" font-family="'JetBrains Mono', monospace" font-size="10">• Local Patient Records</text>
    <text x="20" y="150" fill="#eca8d6" font-family="'JetBrains Mono', monospace" font-size="10">Raw Data Never Leaves</text>

    <!-- Central Federated Coordinator -->
    <rect x="250" y="20" width="200" height="150" rx="8" fill="#000000" stroke="#eca8d6" stroke-width="1.5"/>
    <text x="270" y="55" fill="#FFFFFF" font-family="'Instrument Serif', serif" font-size="18">FEDERATED RMI HUB</text>
    <text x="270" y="85" fill="rgba(255,255,255,0.7)" font-family="'JetBrains Mono', monospace" font-size="10">• SPARQL Query Planner</text>
    <text x="270" y="105" fill="rgba(255,255,255,0.7)" font-family="'JetBrains Mono', monospace" font-size="10">• JWT Zero-Trust Auth</text>
    <text x="270" y="125" fill="#eca8d6" font-family="'JetBrains Mono', monospace" font-size="10">Spring Boot Coordinator</text>

    <!-- Connectors -->
    <path d="M200 95H250" stroke="#eca8d6" stroke-width="1.5" stroke-dasharray="3 3"/>
    <path d="M450 95H500" stroke="#eca8d6" stroke-width="1.5" stroke-dasharray="3 3"/>

    <!-- Research Institute Node B -->
    <rect x="500" y="0" width="200" height="190" rx="8" fill="#000000" stroke="rgba(255,255,255,0.12)" stroke-width="1.5"/>
    <text x="520" y="35" fill="#FFFFFF" font-family="'Instrument Serif', serif" font-size="18">RESEARCH NODE B</text>
    <text x="520" y="65" fill="rgba(255,255,255,0.5)" font-family="'JetBrains Mono', monospace" font-size="10">• Federated Diagnostic Query</text>
    <text x="520" y="85" fill="rgba(255,255,255,0.5)" font-family="'JetBrains Mono', monospace" font-size="10">• Aggregated Knowledge Graph</text>
    <text x="520" y="105" fill="rgba(255,255,255,0.5)" font-family="'JetBrains Mono', monospace" font-size="10">• Jetpack Compose Android Client</text>
    <text x="520" y="150" fill="#eca8d6" font-family="'JetBrains Mono', monospace" font-size="10">Privacy-Preserving Result</text>
  </g>
</svg>
