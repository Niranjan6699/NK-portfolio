<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" fill="none">
  <rect width="800" height="500" fill="#000000"/>

  <!-- Architecture Blueprint Header -->
  <text x="50" y="60" fill="rgba(255,255,255,0.3)" font-family="'JetBrains Mono', monospace" font-size="12" letter-spacing="0.1em">HEALTH TECH // IN DEVELOPMENT</text>
  <text x="50" y="95" fill="#FFFFFF" font-family="'Instrument Serif', serif" font-size="34">SugarScan AI: Vision Health Assistant</text>
  <text x="50" y="125" fill="#eca8d6" font-family="'JetBrains Mono', monospace" font-size="12">REACT NATIVE · FASTAPI · OLLAMA VISION · SUPABASE</text>

  <!-- Flow pipeline cards -->
  <g transform="translate(50, 180)">
    <!-- Stage 1 -->
    <rect x="0" y="0" width="150" height="180" rx="8" fill="#000000" stroke="rgba(255,255,255,0.12)" stroke-width="1.5"/>
    <text x="20" y="35" fill="#FFFFFF" font-family="'Instrument Serif', serif" font-size="18">01. CAPTURE</text>
    <text x="20" y="65" fill="rgba(255,255,255,0.5)" font-family="'JetBrains Mono', monospace" font-size="10">Meal / Label Scan</text>
    <text x="20" y="85" fill="rgba(255,255,255,0.5)" font-family="'JetBrains Mono', monospace" font-size="10">Voice Query</text>
    <text x="20" y="145" fill="#eca8d6" font-family="'JetBrains Mono', monospace" font-size="10">React Native / Expo</text>

    <!-- Arrow 1 -->
    <path d="M160 90H180" stroke="rgba(255,255,255,0.3)" stroke-width="2" stroke-dasharray="4 4"/>

    <!-- Stage 2 -->
    <rect x="190" y="0" width="150" height="180" rx="8" fill="#000000" stroke="rgba(255,255,255,0.12)" stroke-width="1.5"/>
    <text x="210" y="35" fill="#FFFFFF" font-family="'Instrument Serif', serif" font-size="18">02. API ROUTER</text>
    <text x="210" y="65" fill="rgba(255,255,255,0.5)" font-family="'JetBrains Mono', monospace" font-size="10">Payload Validation</text>
    <text x="210" y="85" fill="rgba(255,255,255,0.5)" font-family="'JetBrains Mono', monospace" font-size="10">Async Task Dispatch</text>
    <text x="210" y="145" fill="#eca8d6" font-family="'JetBrains Mono', monospace" font-size="10">FastAPI (Python)</text>

    <!-- Arrow 2 -->
    <path d="M350 90H370" stroke="rgba(255,255,255,0.3)" stroke-width="2" stroke-dasharray="4 4"/>

    <!-- Stage 3 -->
    <rect x="380" y="0" width="150" height="180" rx="8" fill="#000000" stroke="rgba(255,255,255,0.12)" stroke-width="1.5"/>
    <text x="400" y="35" fill="#FFFFFF" font-family="'Instrument Serif', serif" font-size="18">03. INFERENCE</text>
    <text x="400" y="65" fill="rgba(255,255,255,0.5)" font-family="'JetBrains Mono', monospace" font-size="10">Vision LLM Parsing</text>
    <text x="400" y="85" fill="rgba(255,255,255,0.5)" font-family="'JetBrains Mono', monospace" font-size="10">Glycemic Est.</text>
    <text x="400" y="145" fill="#eca8d6" font-family="'JetBrains Mono', monospace" font-size="10">Ollama Local Engine</text>

    <!-- Arrow 3 -->
    <path d="M540 90H560" stroke="rgba(255,255,255,0.3)" stroke-width="2" stroke-dasharray="4 4"/>

    <!-- Stage 4 -->
    <rect x="570" y="0" width="130" height="180" rx="8" fill="#000000" stroke="rgba(255,255,255,0.12)" stroke-width="1.5"/>
    <text x="585" y="35" fill="#FFFFFF" font-family="'Instrument Serif', serif" font-size="18">04. STORE</text>
    <text x="585" y="65" fill="rgba(255,255,255,0.5)" font-family="'JetBrains Mono', monospace" font-size="10">Glucose Log</text>
    <text x="585" y="85" fill="rgba(255,255,255,0.5)" font-family="'JetBrains Mono', monospace" font-size="10">Companion State</text>
    <text x="585" y="145" fill="#eca8d6" font-family="'JetBrains Mono', monospace" font-size="10">Supabase (Postgres)</text>
  </g>
</svg>
